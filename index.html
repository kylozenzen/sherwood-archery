<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f5a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Sherwood">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sherwood</title>
<style>
html,body{margin:0;height:100%;background:#16251b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Georgia,'Times New Roman',serif;color:#f4efe0}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;pointer-events:none;transition:opacity 1s;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .4s;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#gear{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,20,14,.35);color:#fff;font-size:18px;z-index:5}
#panel,#round{position:fixed;inset:0;background:rgba(10,18,12,.85);display:none;align-items:center;justify-content:center;z-index:9}
#panel.open,#round.open{display:flex}
.card{width:min(86vw,340px);background:#17261c;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px;line-height:1.5;font-size:15px;text-align:left}
.card h2{margin:0 0 10px;font-weight:normal;letter-spacing:.14em;font-size:15px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.b{font:inherit;color:#f4efe0;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:10px 14px;margin:10px 8px 0 0}
.b.go{background:#f2c744;color:#1c2a1f;border-color:#f2c744}
.about{font-size:13px;opacity:.7;margin-top:12px}
#rscore{font-size:54px;text-align:center;margin:6px 0}
#rline{text-align:center;opacity:.8}
.ov{position:fixed;inset:0;background:rgba(8,12,18,.88);display:none;align-items:center;justify-content:center;z-index:10;overflow:auto}
.ov.open{display:flex}
.ov .card{max-height:88vh;overflow:auto}
.b.big{display:block;width:100%;margin:10px 0 0;padding:13px 14px;text-align:left;line-height:1.35}
.small{font-size:12px;opacity:.7;font-weight:normal}
.sub{opacity:.75;font-size:14px;margin-bottom:6px}
.sec{margin-top:16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.deed{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.rels{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px}
.rel{background:none;border:2px solid transparent;border-radius:50%;padding:2px;margin:2px;color:inherit;font:inherit;cursor:pointer}
.rel.def{border-radius:14px;font-size:11px;padding:8px 10px;border:1px solid rgba(255,255,255,.3)}
.rel.on{border-color:#f2c744}.rel.lock{opacity:.22;cursor:default}
.rb{display:flex;align-items:center;justify-content:center;border-radius:50%;font-style:normal;font-size:16px}
.page{font-size:13px;line-height:1.5;margin-top:10px;padding:10px 12px;border-left:2px solid rgba(255,230,160,.5);background:rgba(255,255,255,.04)}
.lockp{opacity:.4;font-style:italic}
#menuBtn{position:fixed;left:10px;top:var(--mt);width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(10,14,24,.35);color:#fff;font-size:18px;z-index:5}

#menuBtn{--mt:calc(env(safe-area-inset-top,0px) + 66px)}
#menu{background:radial-gradient(ellipse at 50% 38%,rgba(var(--pan),.38),rgba(var(--pan),.9) 78%);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:opacity .5s}
#menu .mn{width:min(88vw,340px);text-align:center;color:var(--ink);padding:18px 0;animation:mnIn .8s ease-out both}
@keyframes mnIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#menu .emb{width:74px;height:74px;margin:0 auto 6px;display:block;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45));animation:mnFloat 6s ease-in-out infinite}
@keyframes mnFloat{50%{transform:translateY(-5px)}}
#menu h1{margin:4px 0 0;font-weight:normal;font-size:29px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 22px rgba(0,0,0,.55)}
#menu .tag{font-style:italic;opacity:.8;font-size:15px;margin-top:4px}
#menu .div{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 16px;width:70%;color:var(--acc);font-size:10px}
#menu .div i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.6}
#menu .pri{display:block;width:100%;font:inherit;color:var(--btn);background:var(--acc);border:0;border-radius:14px;padding:14px 16px;line-height:1.3;box-shadow:0 6px 26px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.2) inset;cursor:pointer}
#menu .pri b{font-size:17px;letter-spacing:.06em}
#menu .pri .small{opacity:.75;color:var(--btn)}
#menu .pri.done{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:0 0 0 1px var(--acc) inset}
#menu .pri.done .small{color:var(--ink)}
#menu .sec2{display:block;width:100%;margin-top:10px;font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;line-height:1.3;cursor:pointer}
#menu .sec2 b{font-size:15px;letter-spacing:.06em}
#menu .duo{display:flex;gap:10px;margin-top:10px}
#menu .duo button{flex:1;font:inherit;font-size:14px;color:var(--ink);background:none;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 6px;cursor:pointer}
#menu .stats{margin-top:16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
#menu .help{display:none;margin-top:10px;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);text-align:left}
#menu .foot{margin-top:12px;font-size:12px;opacity:.6}
#menu .foot a{color:inherit;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast"></div>
<div id="hint">Drag down to draw · slide to aim · release</div>
<button id="menuBtn" aria-label="Menu">&#9776;</button>
<button id="gear" aria-label="Settings">&#9881;&#xFE0E;</button>
<div id="round"><div class="card">
  <h2 id="rtitle">Round complete</h2>
  <div id="rscore">0</div><div id="rline"></div>
  <div style="text-align:center"><button class="b go" id="rnext">Next target</button></div>
</div></div>
<div id="panel"><div class="card">
  <h2>Settings</h2>
  <label class="row"><span>Sound</span><input type="checkbox" id="optSound"></label>
  <label class="row"><span>Haptics</span><input type="checkbox" id="optHaptic"></label>
  <label class="row"><span>Steady aim assist</span><input type="checkbox" id="optAssist"></label>
  <button class="b" id="restart">Restart round</button><button class="b" id="resetAll">Reset all</button><button class="b" id="close">Close</button>
  <div class="about"><b>About</b><br>Sherwood is a one-thumb zen archery game by Nobody Creative. Hold to steady your breath, drag to aim, release. Read the leaves for the wind.</div>
</div></div>
<div class="ov" id="menu"><div class="mn"><span id="mEmb"></span><h1 id="mTitle"></h1><div class="tag" id="mSub"></div>
 <div class="div"><i></i><span>&#9670;</span><i></i></div>
 <button class="pri" id="mDaily"></button><button class="sec2" id="mFree"></button><button class="sec2" id="mResume" style="display:none"><b>Resume</b></button>
 <div class="duo"><button id="mBook">&#10022; Legend book</button><button id="mInstall" style="display:none">&#11015; Install app</button></div>
 <div class="help" id="mHelp"></div>
 <div class="stats" id="mGrove"></div>
 <div class="foot"><span id="mSibW"></span><a id="mAbout" target="_blank" rel="noopener">Nobody Creative</a></div></div></div>
<div class="ov" id="book"><div class="card"><h2>Legend</h2><div id="bookBody"></div><button class="b" id="bookClose">Close</button></div></div>
<div class="ov" id="result"><div class="card" style="text-align:center"><h2 id="resTitle"></h2><img id="resImg" alt="Result card" style="width:78%;border-radius:10px;margin:6px 0"><div id="resLine" class="small" style="min-height:16px"></div><button class="b" id="resShare">Share</button><button class="b" id="resAgain">Play again</button><button class="b" id="resMenu">Menu</button></div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
let S={level:0,best:0,sound:true,haptic:true,assist:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('sherwood')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sherwood',JSON.stringify(S))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SHOTS=5;
/* ---------- Legend: shared layer (daily, grove, deeds, relics, share) ---------- */
const Legend=(()=>{
 const KEY='nobody_legend_v1';
 const GAMES={lake:'Lady of the Lake',sherwood:'Sherwood',any:'Across the Realm'};
 const RELICS={
  l_white:{g:'lake',n:'White Pebble',base:'#e9e6dc'},
  l_jade:{g:'lake',n:'Jade Skipper',base:'#3f8f6b'},
  l_violet:{g:'lake',n:'Mistwalker Stone',base:'#6a4c93'},
  l_gold:{g:'lake',n:'Gilded Stone',base:'#d4af37'},
  l_moon:{g:'lake',n:'Moonstone',base:'#9db8e8'},
  s_blue:{g:'sherwood',n:'Kingfisher Fletching',c:['#3a7bc8','#f4efe0']},
  s_gold:{g:'sherwood',n:'Golden Fletching',c:['#f2c744','#f4efe0']},
  s_raven:{g:'sherwood',n:'Raven Fletching',c:['#25252a','#9aa3ab']},
  s_silver:{g:'sherwood',n:'Silver Fletching',c:['#cfd6dc','#3a7bc8']},
  s_green:{g:'sherwood',n:'Lincoln Green Fletching',c:['#3f8a46','#f2c744']},
  t_acorn:{g:'any',n:"Green Knight's Acorn",glyph:'✦',tint:'#c9a227'},
  t_seal:{g:'any',n:'Round Table Seal',glyph:'◉',tint:'#8a5a2b'}
 };
 const DEEDS=[
  {id:'l1',g:'lake',stat:'lake_chain',goal:10,n:'Ten Skips',d:'Skip one stone 10 times',r:'l_white'},
  {id:'l2',g:'lake',stat:'lake_chain',goal:20,n:'Twenty Skips',d:'Skip one stone 20 times',r:'l_jade'},
  {id:'l3',g:'lake',stat:'lake_mist',goal:3,n:'Into the Mist',d:'Send 3 stones into the mist',r:'l_violet'},
  {id:'l4',g:'lake',stat:'lake_excal',goal:1,n:'The Lady Stirs',d:'Raise Excalibur once',r:'l_gold'},
  {id:'l5',g:'lake',stat:'lake_daily',goal:3,n:'Lakeside Regular',d:'Finish 3 daily lakes',r:'l_moon'},
  {id:'s1',g:'sherwood',stat:'sw_bull',goal:1,n:'Bullseye',d:'Hit a 10',r:'s_blue'},
  {id:'s2',g:'sherwood',stat:'sw_split',goal:1,n:'Robin Hood',d:'Split an arrow',r:'s_gold'},
  {id:'s3',g:'sherwood',stat:'sw_level',goal:3,n:'Deeper Woods',d:'Clear 3 targets',r:'s_raven'},
  {id:'s4',g:'sherwood',stat:'sw_round',goal:40,n:'Steady Hand',d:'Score 40+ in one round',r:'s_silver'},
  {id:'s5',g:'sherwood',stat:'sw_daily',goal:3,n:'Greenwood Regular',d:'Finish 3 daily targets',r:'s_green'},
  {id:'a1',g:'any',stat:'days',goal:7,n:'A Week Under the Oaks',d:'Visit on 7 different days',r:'t_acorn'},
  {id:'a2',g:'any',stat:'both',goal:1,n:'Round Table Day',d:'Play both games in one day',r:'t_seal'}
 ];
 const PAGES=[
  ['Of the Lake','They say the water keeps what it is given and returns what it must. A stone, skipped true, wakes the surface — and the surface remembers.'],
  ['Of the Greenwood','Beyond the road the oaks lean close. An archer who breathes with the wind needs no map; the forest tells the arrow where to land.'],
  ['Of Two Kingdoms','Camelot keeps its round table, Sherwood its fires. Both kingdoms agree on one thing: patience outlasts strength.'],
  ['Of the Long Road','A legend is only the long road, walked often. Come back tomorrow — the grove will be waiting.']
 ];
 let D={days:{},stats:{},deeds:{},equip:{},daily:{}};
 try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
 const $=id=>document.getElementById(id);
 const pad=n=>String(n).padStart(2,'0');
 const dateStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
 const today=dateStr(new Date());
 const pretty=()=>new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'});
 function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
 const seed=g=>hash(g+':'+today);
 const val=d=>d.stat==='days'?Object.keys(D.days).length:(D.stats[d.stat]||0);
 const o={onUnlock:null,onEquip:null};
 function banner(t){let b=$('lgBanner');if(!b){b=document.createElement('div');b.id='lgBanner';b.style.cssText="position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 130px);transform:translateX(-50%);background:rgba(20,26,36,.93);color:#fff6d8;border:1px solid rgba(255,230,160,.5);border-radius:12px;padding:10px 16px;font:13px Georgia,serif;letter-spacing:.06em;z-index:12;opacity:0;transition:opacity .4s;text-align:center;pointer-events:none;max-width:80vw";document.body.appendChild(b);}b.innerHTML=t;b.style.opacity=1;clearTimeout(b._t);b._t=setTimeout(()=>{b.style.opacity=0},3400);}
 function check(){let any=false;for(const d of DEEDS){if(D.deeds[d.id])continue;if(val(d)>=d.goal){D.deeds[d.id]=today;any=true;const r=RELICS[d.r];banner('Deed complete: <b>'+d.n+'</b><br>Relic earned: '+r.n);if(o.onUnlock)o.onUnlock(d,r);}}if(any)save();}
 function stat(k,v,mode){const c=D.stats[k]||0;D.stats[k]=mode==='max'?Math.max(c,v):c+v;save();check();}
 function visit(game){const a=D.days[today]||(D.days[today]=[]);if(!a.includes(game)){a.push(game);save();if(a.length>=2&&game!=='any'&&!D.seenBoth){D.seenBoth=1;stat('both',1,'add');}check();}}
 function runLen(){const d=new Date();let n=0;if(!D.days[dateStr(d)])d.setDate(d.getDate()-1);while(D.days[dateStr(d)]){n++;d.setDate(d.getDate()-1);}return n;}
 const daysN=()=>Object.keys(D.days).length;
 function dailyDone(g,score){let first=false;const x=D.daily[g];if(!x||x.date!==today){D.daily[g]={date:today,best:score};first=true;}else if(score>x.best)x.best=score;save();return{first,best:D.daily[g].best};}
 function dailyBest(g){const x=D.daily[g];return x&&x.date===today?x.best:null;}
 function getEquip(g){const id=D.equip[g];return id&&D.deeds[DEEDS.find(d=>d.r===id).id]?RELICS[id]:null;}
 function badge(id,sz){const r=RELICS[id];let st='';if(r.base)st='background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),'+r.base+' 60%)';else if(r.c)st='background:linear-gradient(135deg,'+r.c[0]+' 50%,'+r.c[1]+' 50%)';else st='background:'+r.tint+';color:#fff;';return '<i class="rb" style="width:'+sz+'px;height:'+sz+'px;'+st+'">'+(r.glyph||'')+'</i>';}
 function grove(n){const slots=Math.min(28,Math.max(7,Math.ceil(n/7)*7));let h='';for(let i=0;i<slots;i++){const on=i<n;h+='<svg width="18" height="24" viewBox="0 0 18 24" style="margin:1px"><rect x="8" y="16" width="2.4" height="7" fill="'+(on?'#7a5230':'#4a4a4a')+'"/><path d="M9 1 L16 16 L2 16 Z" fill="'+(on?'#4f9a56':'none')+'" stroke="'+(on?'#7ccf84':'#666')+'" stroke-width="1" opacity="'+(on?1:.5)+'"/></svg>';}return h;}
 function renderBook(){
  const n=daysN(),run=runLen(),done=Object.keys(D.deeds).length;
  let h='<div class="sec">The Grove</div><div>'+grove(n)+'</div><div class="small">'+n+' day'+(n===1?'':'s')+' visited · current run '+run+'. The grove never withers — missed days just wait.</div>';
  for(const g of ['lake','sherwood','any']){
   h+='<div class="sec">'+GAMES[g]+'</div>';
   for(const d of DEEDS.filter(x=>x.g===g)){const v=Math.min(val(d),d.goal),ok=!!D.deeds[d.id];h+='<div class="deed"><div><b>'+d.n+'</b><div class="small">'+d.d+'</div></div><div class="small">'+(ok?'✓':v+'/'+d.goal)+'</div></div>';}
   const rl=Object.keys(RELICS).filter(k=>RELICS[k].g===g);
   h+='<div class="rels">';
   if(g!=='any')h+='<button class="rel def'+(!D.equip[g]?' on':'')+'" data-g="'+g+'" data-r="">Default</button>';
   for(const k of rl){const dd=DEEDS.find(x=>x.r===k),un=!!D.deeds[dd.id];h+=g==='any'?'<span class="rel'+(un?'':' lock')+'" title="'+RELICS[k].n+'">'+badge(k,36)+'</span>':'<button class="rel'+(un?'':' lock')+(D.equip[g]===k?' on':'')+'" data-g="'+g+'" data-r="'+(un?k:'')+'" title="'+RELICS[k].n+'">'+badge(k,36)+'</button>';}
   h+='</div>';
  }
  h+='<div class="sec">Pages of the Legend</div>';
  PAGES.forEach((p,i)=>{const need=(i+1)*3;h+=done>=need?'<div class="page"><b>'+p[0]+'</b><br>'+p[1]+'</div>':'<div class="page lockp">Locked — complete '+(need-done)+' more deed'+(need-done===1?'':'s')+'</div>';});
  $('bookBody').innerHTML=h;
 }
 function openBook(){renderBook();$('book').classList.add('open');}
 document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.rel[data-g]');if(!b)return;const g=b.dataset.g,r=b.dataset.r;if(r===''&&!b.classList.contains('def'))return;D.equip[g]=r;save();renderBook();if(o.onEquip)o.onEquip();});
 const ABOUT_URL='https://bencampbell.netlify.app'; // Nobody Creative link shown on the menu
 const SIBLINGS={lake:{name:'Sherwood',url:''},sherwood:{name:'Lady of the Lake',url:''}}; // fill in deployed URLs to cross-link
 const THEME={
  lake:{acc:'#ffe9a8',ink:'#e8ecf4',btn:'#1b2433',pan:'21,28,44',emb:"<svg class='emb' viewBox='0 0 80 80'><g fill='none' stroke='#cfe3ff' stroke-width='2' opacity='.85'><ellipse cx='40' cy='58' rx='30' ry='9'/><ellipse cx='40' cy='58' rx='20' ry='5.5' opacity='.7'/><ellipse cx='40' cy='58' rx='10' ry='3' opacity='.5'/></g><path d='M40 8l3 34h-6z' fill='#ffe9a8'/><rect x='31' y='40' width='18' height='3.4' rx='1.7' fill='#ffe9a8'/><rect x='38.4' y='43' width='3.2' height='10' fill='#ffe9a8'/></svg>"},
  sherwood:{acc:'#f2c744',ink:'#f4efe0',btn:'#1c2a1f',pan:'23,38,28',emb:"<svg class='emb' viewBox='0 0 80 80'><circle cx='40' cy='42' r='30' fill='#f4efe0'/><circle cx='40' cy='42' r='22' fill='#222'/><circle cx='40' cy='42' r='15' fill='#3b78b8'/><circle cx='40' cy='42' r='9' fill='#c8362f'/><circle cx='40' cy='42' r='4' fill='#f2c744'/><path d='M40 42L68 10' stroke='#6b5230' stroke-width='2.6' stroke-linecap='round'/><path d='M68 10l-8 1.5 6.5 6.5z' fill='#c8362f'/></svg>"}};
 let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;});
 const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 function openMenu(c){
  const T=THEME[c.game]||THEME.lake,m=$('menu');
  m.style.setProperty('--acc',T.acc);m.style.setProperty('--ink',T.ink);m.style.setProperty('--btn',T.btn);m.style.setProperty('--pan',T.pan);
  $('mEmb').innerHTML=T.emb;$('mTitle').textContent=c.title;$('mSub').textContent=c.sub;
  const best=dailyBest(c.game),done=best!==null;
  const d=$('mDaily');d.className='pri'+(done?' done':'');
  d.innerHTML='<b>'+c.dailyName+'</b><br><span class="small">'+(done?'Played today · best '+best+' ✓':c.dailyHint)+'</span>';
  $('mFree').innerHTML='<b>Free play</b><br><span class="small">'+c.freeHint+'</span>';
  const close=()=>m.classList.remove('open');
  d.onclick=()=>{close();c.onDaily();};$('mFree').onclick=()=>{close();c.onFree();};
  $('mBook').onclick=openBook;$('bookClose').onclick=()=>$('book').classList.remove('open');
  $('mResume').style.display=c.canResume?'block':'none';$('mResume').onclick=close;
  const ib=$('mInstall'),help=$('mHelp');help.style.display='none';
  if(isStandalone())ib.style.display='none';

}
function drawFx(dt){
 for(const f of fx){f.l-=dt/(f.k==='txt'?1300:f.k==='ring'?600:f.k==='spark'?800:700);
  if(f.k==='dust'){f.x+=f.vx*dt;f.y+=f.vy*dt;g.fillStyle=`rgba(230,210,150,${Math.max(0,f.l*.7).toFixed(3)})`;g.beginPath();g.arc(f.x,f.y,2.4,0,6.2832);g.fill();}
  else if(f.k==='spark'){f.vy+=.0004*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;g.save();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,215,90,${Math.max(0,f.l).toFixed(3)})`;g.beginPath();g.arc(f.x,f.y,2.2*f.l+.5,0,6.2832);g.fill();g.restore();}
  else if(f.k==='ring'){g.strokeStyle=f.gold?`rgba(255,215,90,${Math.max(0,f.l*.9).toFixed(3)})`:`rgba(255,255,255,${Math.max(0,f.l*.7).toFixed(3)})`;g.lineWidth=2.4;g.beginPath();g.arc(f.x,f.y,6+(1-f.l)*(f.gold?44:26),0,6.2832);g.stroke();}
  else{f.y-=dt*.03;g.save();g.globalAlpha=Math.max(0,Math.min(1,f.l*1.4));g.fillStyle=f.big?'#f2c744':'#fff';g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=3.5;g.lineJoin='round';g.font=(f.big?'italic 26px':'20px')+' Georgia,serif';g.textAlign='center';g.strokeText(f.s,f.x,f.y);g.fillText(f.s,f.x,f.y);g.restore();}}
 fx=fx.filter(f=>f.l>0);
}

/* ---------- loop ---------- */
let lt=performance.now();
function frame(now){
 const dt=Math.min(50,now-lt);lt=now;
 hold=(drawing&&full)?now-fullT0:0;
 const tz=drawing?1+.55*draw:1;zoom+=(tz-zoom)*Math.min(1,dt*(drawing?.01:.007));zoomS=zoom*(1+.02*punch);
 if(drawing&&full&&hold>=1400&&!steadied){steadied=true;buzz(10);tone(660,.15,'sine',.05);}
 g.save();
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;shake*=.88;if(shake<.1)shake=0;punch*=.93;
 g.translate(TX+sx,TY+sy);g.scale(zoomS,zoomS);g.translate(-TX,-TY);
 g.drawImage(bg,0,0,W,H);
 drawLight(dt,now);
 drawLeaves(dt,now);
 drawStand();
 g.drawImage(tgt,TX-tgt.s/2,TY-tgt.s/2,tgt.s,tgt.s);
 for(const a of arrows)drawArrowStuck(a,now);
 if(flight)drawFlight(dt);
 drawFx(dt);
 drawMist(dt);
 g.restore();
 drawBlades(now);
 drawBow(now);
 g.fillStyle=vig;g.fillRect(0,0,W,H);
 {const zf=clamp((zoom-1)/.55,0,1);if(zf>.01){g.globalAlpha=zf*.55;g.fillStyle=vig;g.fillRect(0,0,W,H);g.globalAlpha=1;}}
 drawHUD(now);
 if(phase==='wait'&&now>roundEnd)showRound();
 requestAnimationFrame(frame);
}
function startMode(m){mode=m;arrows=[];shots=0;total=0;flight=null;phase='ready';drawing=false;draw=0;full=false;newWind();rebuild();aim={x:TX,y:TY};$('round').classList.remove('open');fx=[];if(m==='daily')toast('Today\u2019s target \u00B7 '+windText());}
function showMenu(resume){Legend.openMenu({game:'sherwood',title:'Sherwood',sub:'Breathe. Draw. Let go.',dailyName:'Today\u2019s Target',dailyHint:'5 arrows \u00B7 the same wind for everyone',freeHint:'Zen archery \u2014 targets shrink as you clear them',canResume:resume===true,onDaily:()=>startMode('daily'),onFree:()=>startMode('free')});}
function refreshEquip(){const r=Legend.getEquip('sherwood');FL=r&&r.c?r.c:['#c8362f','#f4efe0'];}
$('menuBtn').onclick=()=>showMenu(true);
Legend.onEquip=refreshEquip;Legend.onUnlock=()=>{[659,784,988].forEach((f,i)=>tone(f,.9,'sine',.06,0,i*.1));buzz([20,40,20]);};
refreshEquip();resize();newWind();requestAnimationFrame(frame);showMenu();
})();
</script>
